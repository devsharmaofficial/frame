services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      FRAMER_API_KEY: dev-framer-key-please-change
    ports:
      - "3000:3000"
    volumes:
      - framer-data:/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  framer-data:
