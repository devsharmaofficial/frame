[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "frame-sdk"
version = "0.1.0"
description = "Official Python SDK for Frame — AI-agent payment-control infrastructure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["payments", "ai-agents", "policy", "frame"]

[tool.setuptools.packages.find]
include = ["frame*"]
